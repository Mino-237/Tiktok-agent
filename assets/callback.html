<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Autorisierung - Callback</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #222; }
  .code-box { background: #f4f4f4; border: 1px solid #ddd; border-radius: 6px; padding: 16px; word-break: break-all; font-family: monospace; margin: 20px 0; }
  .label { font-weight: bold; margin-top: 20px; }
  button { padding: 10px 16px; cursor: pointer; }
</style>
</head>
<body>

<h1>TikTok Autorisierung abgeschlossen</h1>
<p>Kopiere den folgenden Code - er wird gebraucht, um die Zugangs-Token abzurufen.</p>

<div class="label">Autorisierungscode (code):</div>
<div class="code-box" id="code">wird geladen...</div>
<button onclick="kopieren()">Code kopieren</button>

<div class="label">Vollständige URL (zur Fehlersuche):</div>
<div class="code-box" id="volle_url">wird geladen...</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  document.getElementById("code").textContent = code || "(kein 'code' Parameter gefunden - prüfe die URL oben im Browser)";
  document.getElementById("volle_url").textContent = window.location.href;

  function kopieren() {
    navigator.clipboard.writeText(document.getElementById("code").textContent);
    alert("Code kopiert!");
  }
</script>

</body>
</html>
