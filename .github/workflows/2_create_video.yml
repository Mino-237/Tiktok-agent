name: "2 - Video erstellen"

on:
  workflow_dispatch:
    # Wird NUR manuell gestartet (über den "Run workflow"-Button in
    # GitHub Actions), nachdem du pending_script.json geprüft/bearbeitet
    # hast. Läuft NICHT automatisch nach einem Zeitplan.

jobs:
  create_video:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Whisper-Modell cachen (spart Downloadzeit bei jedem Lauf)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-model

      - name: Video erstellen
        env:
          DID_API_KEY: ${{ secrets.DID_API_KEY }}
          DID_AVATAR_IMAGE_URL: ${{ secrets.DID_AVATAR_IMAGE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python 2_create_video.py

      - name: Fertiges Video zum Download bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video-${{ github.run_id }}
          path: output/video_final.mp4
          retention-days: 14

      - name: Alle Zwischendateien als Artifact sichern (zum Debuggen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output-${{ github.run_id }}
          path: output/
          retention-days: 14
